<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Felipa&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
    <title>Sort Smart</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="container-fluid">
          <div class="d-flex align-items-center gap-4">
            <a class="navbar-brand" href="#">SortSmart</a>
            <div class="navbar-nav">
              <a class="nav-link active" href="#">Home</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="app-wrapper">
        <!-- Brand -->
        <div class="brand">
          <div class="brand-icon"><i class="bi bi-flower2"></i></div>
          <div class="brand-text">Sort<span>Smart</span></div>
        </div>
        <p class="tagline">
          <i class="bi bi-search" style="margin-right: 6px; color: #9a9287"></i>
          Find out if it's bio, recyclable, or something else.
          <small>tap any total to filter your list</small>
        </p>

        <!-- Search -->
        <div class="search-row">
          <input
            id="item-input"
            placeholder="e.g. banana peel, glass jar, battery..."
            autocomplete="off"
          />
          <button class="btn-primary" id="check-btn">
            <i class="bi bi-arrow-right"></i> Check
          </button>
        </div>

        <!-- Suggestions -->
        <div class="suggestions" id="suggestions"></div>

        <!-- Result -->
        <div id="result-area"></div>

        <!-- Save error -->
        <div id="save-error-slot"></div>

        <!-- Totals -->
        <div class="totals-header">
          <h3 class="totals-title">
            <i
              class="bi bi-pie-chart"
              style="margin-right: 6px; color: #9a9287"
            ></i
            >Totals
          </h3>
          <div class="range-toggle" id="range-toggle">
            <button class="range-btn active" data-range="week">Week</button>
            <button class="range-btn" data-range="month">Month</button>
            <button class="range-btn" data-range="year">Year</button>
            <button class="range-btn" data-range="all">All</button>
          </div>
        </div>

        <div class="totals-grid" id="totals-grid"></div>

        <!-- History -->
        <div class="history-header">
          <h3 class="history-title">
            <i
              class="bi bi-clock-history"
              style="margin-right: 4px; color: #9a9287"
            ></i>
            Recent
            <span
              id="filter-indicator"
              class="filter-indicator"
              style="display: none"
            >
              <span id="filter-label"></span>
              <button
                class="clear-filter"
                id="clear-filter-btn"
                title="Clear filter"
              >
                ✕
              </button>
            </span>
          </h3>
          <button class="clear-btn" id="clear-history">
            <i class="bi bi-trash3"></i> Clear
          </button>
        </div>
        <div id="history-list"></div>
      </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
  </body>
</html>
